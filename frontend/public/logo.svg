<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 48" role="img" aria-labelledby="logo-title">
  <title id="logo-title">FindingsAI</title>
  <style>
    :root { --foreground:60 2.564% 7.647%; --primary:14.380 55.760% 42.549%; --brand:hsl(var(--primary)); }
    @media (prefers-color-scheme:dark) { :root { --foreground:48 33.333% 97.059%; --primary:14.876 69.942% 66.078%; } }
    .mark { color:var(--link,var(--brand)); }
    .wordmark { fill:hsl(var(--foreground)); font-family:Inter,system-ui,-apple-system,sans-serif; font-size:29px; font-weight:500; letter-spacing:-.6px; }
    .ai { fill:var(--link,var(--brand)); font-weight:600; }
  </style>
  <g class="mark" transform="translate(2 7) scale(1.4)" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="7.5"/>
    <path d="m16 16 5 5"/>
    <path d="m10.5 6 .9 3.6 3.6.9-3.6.9-.9 3.6-.9-3.6-3.6-.9 3.6-.9Z" fill="currentColor" stroke="none"/>
  </g>
  <text x="46" y="34" class="wordmark">Findings<tspan class="ai">AI</tspan></text>
</svg>
